[package]
name = "echo-python"
version = "0.1.0"
edition = "2021"
description = "A fast Python linter with custom rules"
license = "MIT"
readme = "readme.txt"
repository = "https://github.com/anyaagarenko/echo-python"
keywords = ["linter", "python", "rust", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "echo-python"
path = "src/main.rs"

[lib]
name = "echo_python"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
clap = "4.6.6"
rayon = "1.11.0"
rustpython-ast = { version = "0.4.0", features = ["visitor"] }
rustpython-parser = "0.4.0"
walkdir = "2.5.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
