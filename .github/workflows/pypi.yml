jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: '--release --out dist --locked'
          manylinux: auto
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          target: ${{ matrix.platform.target }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: x86_64
  macos:
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: '--release --out dist --locked'
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          target: ${{ matrix.platform.target }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist
    strategy:
      matrix:
        platform:
          - runner: macos-latest
            target: aarch64
          - runner: macos-15-intel
            target: x86_64
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    name: Release
    needs:
      - linux
      - windows
      - macos
      - sdist
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: wheels-*/*
      - if: ${{ startsWith(github.ref, 'refs/tags/') }}
        name: Install uv
        uses: astral-sh/setup-uv@v7
      - if: ${{ startsWith(github.ref, 'refs/tags/') }}
        name: Publish to PyPI
        run: uv publish --trusted-publishing always 'wheels-*/*'
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          args: '--out dist'
          command: sdist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist
  windows:
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: '--release --out dist --locked'
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          target: ${{ matrix.platform.target }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist
    strategy:
      matrix:
        platform:
          - python_arch: x86_64
            runner: windows-latest
            target: x86_64
name: PyPI
'on':
  pull_request: {}
  push:
    branches:
      - main
      - master
    tags:
      - v[0-9]+.*
  workflow_dispatch: {}
permissions:
  contents: read
