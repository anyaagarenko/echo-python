jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: '--release --out dist --locked'
          manylinux: auto
          sccache: true
          target: ${{ matrix.platform.target }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: aarch64
          - runner: ubuntu-latest
            target: x86_64
  macos:
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: '--release --out dist --locked'
          sccache: true
          target: ${{ matrix.platform.target }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist
    strategy:
      matrix:
        platform:
          - runner: macos-latest
            target: aarch64
          - runner: macos-latest
            target: x86_64
  release:
    name: Publish
    needs:
      - linux
      - macos
      - sdist
      - windows
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --skip-existing dist/*
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          args: '--out dist'
          command: sdist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist
  windows:
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: '--release --out dist --locked'
          sccache: true
          target: ${{ matrix.platform.target }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x86_64
name: PyPI
'on':
  push:
    branches:
      - main
permissions:
  contents: read
